<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JWT Token Decoder & Inspector</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4">
<div class="max-w-3xl mx-auto">
  <h1 class="text-2xl font-bold text-center mb-2 text-blue-400">JWT Token Decoder & Inspector</h1>
  <p class="text-center text-gray-400 text-sm mb-4">Paste a JWT to decode and inspect claims</p>

  <div class="mb-4">
    <label for="jwtInput" class="block text-sm font-medium text-gray-300 mb-1">JWT Token</label>
    <textarea id="jwtInput" rows="4" class="w-full bg-gray-800 border border-gray-600 rounded p-3 text-xs font-mono text-green-300 focus:outline-none focus:border-blue-500" placeholder="Paste JWT token here..." aria-label="JWT token input"></textarea>
    <div class="flex gap-2 mt-2">
      <button onclick="decode()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-sm font-medium">Decode</button>
      <button onclick="loadSample()" class="bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded text-sm">Load Sample</button>
      <button onclick="clearAll()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded text-sm">Clear</button>
    </div>
  </div>

  <div id="result" class="space-y-3"></div>

  <div class="bg-gray-800 rounded p-3 mt-4 text-xs text-gray-400">
    <strong class="text-purple-400">Note:</strong> Signature verification requires the secret/public key and is not performed here. This tool only decodes the header and payload (Base64URL decoding). Do not paste production tokens — use only test/sample JWTs.
  </div>
</div>

<script>
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function b64urlDecode(str) {
  str = str.replace(/-/g, '+').replace(/_/g, '/');
  while (str.length % 4) str += '=';
  try {
    return decodeURIComponent(escape(atob(str)));
  } catch {
    return atob(str);
  }
}

function formatJson(obj) {
  return JSON.stringify(obj, null, 2);
}

function loadSample() {
  // Sample JWT (HS256 signed, non-sensitive)
  const header = btoa(JSON.stringify({ alg: 'HS256', typ: 'JWT' })).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
  const now = Math.floor(Date.now()/1000);
  const payload = btoa(JSON.stringify({
    sub: '1234567890',
    name: 'Jane Doe',
    email: 'jane@example.com',
    role: 'admin',
    iat: now - 3600,
    exp: now + 3600,
    nbf: now - 3600,
    iss: 'https://auth.example.com',
    aud: 'my-app',
  })).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
  document.getElementById('jwtInput').value = `${header}.${payload}.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c`;
  decode();
}

function clearAll() {
  document.getElementById('jwtInput').value = '';
  document.getElementById('result').innerHTML = '';
}

function decode() {
  const jwt = document.getElementById('jwtInput').value.trim();
  if (!jwt) return;

  const parts = jwt.split('.');
  if (parts.length !== 3) {
    document.getElementById('result').innerHTML = '<div class="bg-red-900 border border-red-600 rounded p-3 text-sm text-red-300">Invalid JWT format. Expected 3 parts separated by dots.</div>';
    return;
  }

  let header, payload;
  try { header = JSON.parse(b64urlDecode(parts[0])); }
  catch { document.getElementById('result').innerHTML = '<div class="bg-red-900 border border-red-600 rounded p-3 text-sm text-red-300">Failed to decode header.</div>'; return; }
  try { payload = JSON.parse(b64urlDecode(parts[1])); }
  catch { document.getElementById('result').innerHTML = '<div class="bg-red-900 border border-red-600 rounded p-3 text-sm text-red-300">Failed to decode payload.</div>'; return; }

  const now = Math.floor(Date.now() / 1000);

  // Time claim analysis
  let expStatus = null, iatInfo = null, nbfStatus = null;
  if (payload.exp !== undefined) {
    const expired = now > payload.exp;
    const diff = payload.exp - now;
    expStatus = { expired, diff, date: new Date(payload.exp * 1000).toLocaleString() };
  }
  if (payload.iat !== undefined) {
    iatInfo = new Date(payload.iat * 1000).toLocaleString();
  }
  if (payload.nbf !== undefined) {
    const notYetValid = now < payload.nbf;
    nbfStatus = { notYetValid, date: new Date(payload.nbf * 1000).toLocaleString() };
  }

  // Structure visualization
  const structHtml = `
    <div class="font-mono text-xs break-all">
      <span class="text-red-400">${escapeHtml(parts[0])}</span>.<span class="text-green-400">${escapeHtml(parts[1])}</span>.<span class="text-blue-400">${escapeHtml(parts[2])}</span>
    </div>
    <div class="flex gap-4 text-xs mt-1">
      <span><span class="text-red-400 font-bold">■</span> Header</span>
      <span><span class="text-green-400 font-bold">■</span> Payload</span>
      <span><span class="text-blue-400 font-bold">■</span> Signature</span>
    </div>
  `;

  function renderClaims(obj, special) {
    return Object.entries(obj).map(([k, v]) => {
      const isSpecial = special.includes(k);
      let extra = '';
      if (k === 'exp' && expStatus) {
        extra = expStatus.expired
          ? `<span class="ml-2 bg-red-900 text-red-300 px-2 py-0.5 rounded text-xs">EXPIRED (${expStatus.date})</span>`
          : `<span class="ml-2 bg-green-900 text-green-300 px-2 py-0.5 rounded text-xs">VALID (${expStatus.date}, expires in ${Math.floor(expStatus.diff/60)}m)</span>`;
      }
      if (k === 'iat') extra = `<span class="ml-2 text-gray-500 text-xs">Issued: ${iatInfo}</span>`;
      if (k === 'nbf' && nbfStatus) {
        extra = nbfStatus.notYetValid
          ? `<span class="ml-2 bg-yellow-900 text-yellow-300 px-2 py-0.5 rounded text-xs">NOT YET VALID (${nbfStatus.date})</span>`
          : `<span class="ml-2 bg-green-900 text-green-300 px-2 py-0.5 rounded text-xs">ACTIVE since ${nbfStatus.date}</span>`;
      }
      return `
        <tr class="border-b border-gray-700">
          <td class="py-1.5 pr-3 font-mono text-xs ${isSpecial ? 'text-yellow-300 font-semibold' : 'text-blue-300'}">${escapeHtml(k)}</td>
          <td class="py-1.5 font-mono text-xs text-gray-200">${escapeHtml(String(typeof v === 'object' ? JSON.stringify(v) : v))}${extra}</td>
        </tr>
      `;
    }).join('');
  }

  const stdClaims = ['sub','iss','aud','exp','iat','nbf','jti'];

  document.getElementById('result').innerHTML = `
    <div class="bg-gray-800 rounded p-3">
      <div class="text-xs font-semibold text-gray-400 mb-2">Token Structure</div>
      ${structHtml}
    </div>
    <div class="bg-gray-800 rounded p-3">
      <div class="text-xs font-semibold text-red-400 mb-2">Header</div>
      <table class="w-full"><tbody>${renderClaims(header, ['alg','typ'])}</tbody></table>
    </div>
    <div class="bg-gray-800 rounded p-3">
      <div class="text-xs font-semibold text-green-400 mb-2">Payload Claims</div>
      <table class="w-full"><tbody>${renderClaims(payload, stdClaims)}</tbody></table>
    </div>
    <div class="bg-gray-800 rounded p-3">
      <div class="text-xs font-semibold text-blue-400 mb-1">Signature</div>
      <div class="font-mono text-xs text-gray-400 break-all">${escapeHtml(parts[2])}</div>
      <div class="text-xs text-orange-400 mt-1">⚠ Signature not verified (requires secret/key)</div>
    </div>
  `;
}

document.getElementById('jwtInput').addEventListener('input', () => {
  if (document.getElementById('jwtInput').value.trim()) decode();
});
</script>
</body>
</html>
